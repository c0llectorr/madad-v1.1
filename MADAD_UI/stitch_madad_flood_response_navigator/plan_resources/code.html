<style>
        /* Custom Input Styles for Floating Label */
        .input-group {
            position: relative;
            margin-bottom: 24px;
        }
        
        .input-field {
            width: 100%;
            height: 56px;
            padding: 24px 16px 8px 16px;
            background-color: theme('colors.surface-container-high');
            border: none;
            border-bottom: 2px solid theme('colors.outline');
            border-radius: 4px 4px 0 0;
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: theme('colors.on-surface');
        }

        .input-field:focus {
            border-bottom-color: theme('colors.primary');
            background-color: theme('colors.surface-container-highest');
        }

        .input-label {
            position: absolute;
            top: 18px;
            left: 16px;
            font-size: 16px;
            color: theme('colors.on-surface-variant');
            transition: transform 0.2s, font-size 0.2s, color 0.2s;
            pointer-events: none;
            font-family: 'Inter', sans-serif;
        }

        .input-field:focus + .input-label,
        .input-field:not(:placeholder-shown) + .input-label {
            transform: translateY(-12px);
            font-size: 12px;
            color: theme('colors.primary');
        }

        .input-field:not(:focus):not(:placeholder-shown) + .input-label {
            color: theme('colors.on-surface-variant');
        }

        .stepper-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            background-color: transparent;
            border: none;
            color: theme('colors.on-surface-variant');
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            border-radius: theme('borderRadius.full');
        }
        .stepper-btn:hover {
            background-color: theme('colors.surface-variant');
            color: theme('colors.on-surface');
        }
        .stepper-btn:active {
            background-color: theme('colors.surface-container-highest');
        }
        
        /* Remove number input arrows */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-sans antialiased text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface border-b border-secondary/12 flex justify-between items-center w-full px-margin-mobile h-touch-target-min fixed top-0 z-50">
<div class="flex items-center gap-2">
<button aria-label="Go back" class="w-12 h-12 flex items-center justify-center text-on-surface hover:bg-surface-container-low rounded-full transition-colors active:scale-95 duration-100">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Plan Resources</h1>
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-[calc(theme('spacing.touch-target-min')+theme('spacing.margin-mobile'))] pb-32 px-margin-mobile max-w-3xl mx-auto w-full">
<!-- Summary Card -->
<section class="mb-8">
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden flex relative">
<!-- Severity Indicator Bar -->
<div class="w-2 bg-status-warning absolute left-0 top-0 bottom-0"></div>
<div class="p-6 pl-8 flex-grow">
<h2 class="font-title-lg text-title-lg text-on-surface mb-4">Taunsa Sector Alpha</h2>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Severity</span>
<div class="flex items-center gap-2 text-status-warning font-label-lg text-label-lg">
<span class="material-symbols-outlined" data-icon="warning" style="font-variation-settings: 'FILL' 1;">warning</span>
                                High
                            </div>
</div>
<div class="flex flex-col">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-1">Est. Population</span>
<div class="flex items-center gap-2 text-on-surface font-body-lg text-body-lg">
<span class="material-symbols-outlined" data-icon="group">group</span>
                                450
                            </div>
</div>
</div>
</div>
</div>
</section>
<!-- Resource Allocation Section -->
<section>
<h3 class="font-title-lg text-title-lg text-on-surface mb-6 border-b border-outline-variant/30 pb-2">Resource Allocation</h3>
<form class="space-y-2">
<!-- Food Packages -->
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center bg-surface-container rounded-full text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="nutrition">nutrition</span>
</div>
<div class="flex-grow">
<div class="input-group mb-0">
<input class="input-field" id="food" min="0" placeholder=" " type="number" value="0"/>
<label class="input-label" for="food">Food Packages (kg)</label>
</div>
</div>
<div class="flex items-center gap-1 shrink-0 bg-surface-container rounded-full p-1">
<button class="stepper-btn" onclick="stepDown('food')" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<button class="stepper-btn" onclick="stepUp('food')" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Water Bottles -->
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center bg-surface-container rounded-full text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="water_drop">water_drop</span>
</div>
<div class="flex-grow">
<div class="input-group mb-0">
<input class="input-field" id="water" min="0" placeholder=" " type="number" value="0"/>
<label class="input-label" for="water">Water Bottles (liters)</label>
</div>
</div>
<div class="flex items-center gap-1 shrink-0 bg-surface-container rounded-full p-1">
<button class="stepper-btn" onclick="stepDown('water')" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<button class="stepper-btn" onclick="stepUp('water')" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Blankets -->
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center bg-surface-container rounded-full text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="bedding">drive_file_rename</span>
</div>
<div class="flex-grow">
<div class="input-group mb-0">
<input class="input-field" id="blankets" min="0" placeholder=" " type="number" value="0"/>
<label class="input-label" for="blankets">Blankets (units)</label>
</div>
</div>
<div class="flex items-center gap-1 shrink-0 bg-surface-container rounded-full p-1">
<button class="stepper-btn" onclick="stepDown('blankets')" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<button class="stepper-btn" onclick="stepUp('blankets')" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Clothes -->
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center bg-surface-container rounded-full text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="checkroom">checkroom</span>
</div>
<div class="flex-grow">
<div class="input-group mb-0">
<input class="input-field" id="clothes" min="0" placeholder=" " type="number" value="0"/>
<label class="input-label" for="clothes">Clothes (kits)</label>
</div>
</div>
<div class="flex items-center gap-1 shrink-0 bg-surface-container rounded-full p-1">
<button class="stepper-btn" onclick="stepDown('clothes')" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<button class="stepper-btn" onclick="stepUp('clothes')" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
<!-- Boats -->
<div class="flex items-center gap-4">
<div class="w-12 h-12 flex items-center justify-center bg-surface-container rounded-full text-primary shrink-0">
<span class="material-symbols-outlined" data-icon="sailing">sailing</span>
</div>
<div class="flex-grow">
<div class="input-group mb-0">
<input class="input-field" id="boats" min="0" placeholder=" " type="number" value="0"/>
<label class="input-label" for="boats">Boats (units)</label>
</div>
</div>
<div class="flex items-center gap-1 shrink-0 bg-surface-container rounded-full p-1">
<button class="stepper-btn" onclick="stepDown('boats')" type="button">
<span class="material-symbols-outlined" data-icon="remove">remove</span>
</button>
<button class="stepper-btn" onclick="stepUp('boats')" type="button">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
</div>
</div>
</form>
</section>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-outline-variant/20 p-4 pb-6 shadow-[0_-4px_16px_rgba(0,0,0,0.05)] z-40">
<div class="max-w-3xl mx-auto flex gap-4">
<button class="flex-1 h-[56px] border border-secondary text-secondary font-label-lg text-label-lg rounded-full flex items-center justify-center hover:bg-secondary/5 transition-colors active:scale-95 duration-100">
                Cancel
            </button>
<button class="flex-[2] h-[56px] bg-primary text-on-primary font-label-lg text-label-lg rounded-full flex items-center justify-center shadow-sm hover:bg-primary/90 transition-colors active:scale-95 duration-100 gap-2">
<span class="material-symbols-outlined" data-icon="local_shipping">local_shipping</span>
                Confirm Dispatch
            </button>
</div>
</div>
<script>
        function stepUp(id) {
            const input = document.getElementById(id);
            input.value = parseInt(input.value || 0) + 10;
            input.dispatchEvent(new Event('change'));
        }

        function stepDown(id) {
            const input = document.getElementById(id);
            const val = parseInt(input.value || 0) - 10;
            input.value = val >= 0 ? val : 0;
            input.dispatchEvent(new Event('change'));
        }
    </script>
</body></html>
