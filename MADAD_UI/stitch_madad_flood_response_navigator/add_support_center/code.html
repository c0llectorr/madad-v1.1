<!DOCTYPE html>

<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .material-symbols-outlined {
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Custom Input Styles */
        .madad-input {
            position: relative;
        }
        
        .madad-input input, .madad-input select {
            width: 100%;
            height: 56px;
            padding: 24px 16px 8px 16px;
            background-color: theme('colors.surface-container-lowest');
            border: 1px solid rgba(70, 75, 113, 0.12);
            border-radius: theme('borderRadius.DEFAULT');
            border-bottom: 2px solid theme('colors.on-surface-variant');
            transition: all 0.2s ease;
            outline: none;
            color: theme('colors.on-surface');
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            line-height: 24px;
        }
        
        .madad-input input:focus, .madad-input select:focus {
            border-bottom-color: theme('colors.primary');
            background-color: theme('colors.surface-container-lowest');
        }
        
        .madad-input label {
            position: absolute;
            left: 16px;
            top: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: theme('colors.on-surface-variant');
            transition: all 0.2s ease;
            pointer-events: none;
        }
        
        .madad-input input:focus + label,
        .madad-input input:not(:placeholder-shown) + label,
        .madad-input select:focus + label,
        .madad-input select:not([value=""]) + label {
            top: 8px;
            font-size: 12px;
            color: theme('colors.primary');
        }
        
        .madad-input select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- TopAppBar (Transactional - Hidden Nav, Keep Header for context but with back button) -->
<header class="bg-surface border-b border-outline-variant/12 shadow-sm fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-container-high active:scale-95 transition-all p-2 rounded-full w-[48px] h-[48px] flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">MADAD</h1>
</div>
<div>
<!-- Empty trailing for transactional screen -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-[80px] pb-[100px] px-margin-mobile md:px-margin-desktop max-w-[1280px] mx-auto w-full">
<!-- Header Section -->
<div class="mb-8 mt-4">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Add New Center</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Register a new support center to the MADAD network. Ensure coordinates are accurate for field routing.</p>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-lg shadow-[0_4px_8px_rgba(0,0,0,0.08)] border border-outline-variant/12 overflow-hidden relative">
<!-- Severity Indicator (Decorative for 'new' center, standard primary) -->
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
<form class="p-6 md:p-8 flex flex-col gap-6 ml-1">
<h3 class="font-title-lg text-title-lg text-on-surface mb-2 border-b border-outline-variant/12 pb-2">Center Information</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Center Name -->
<div class="madad-input">
<input class="min-h-[touch-target-min]" id="centerName" placeholder=" " required="" type="text"/>
<label for="centerName">Center Name</label>
</div>
<!-- Unique Code -->
<div class="madad-input">
<input class="min-h-[touch-target-min]" id="uniqueCode" placeholder=" " required="" type="text"/>
<label for="uniqueCode">Unique Code (e.g., C-104)</label>
</div>
</div>
<h3 class="font-title-lg text-title-lg text-on-surface mb-2 mt-4 border-b border-outline-variant/12 pb-2">Location Details</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Province Dropdown -->
<div class="madad-input">
<select class="min-h-[touch-target-min]" id="province" required="">
<option disabled="" selected="" value=""></option>
<option value="sindh">Sindh</option>
<option value="punjab">Punjab</option>
<option value="kpk">Khyber Pakhtunkhwa</option>
<option value="balochistan">Balochistan</option>
</select>
<label for="province">Province</label>
</div>
<!-- City Dropdown -->
<div class="madad-input">
<select class="min-h-[touch-target-min]" id="city" required="">
<option disabled="" selected="" value=""></option>
<option value="karachi">Karachi</option>
<option value="hyderabad">Hyderabad</option>
<option value="sukkur">Sukkur</option>
<!-- Add more dynamically based on province ideally -->
</select>
<label for="city">City</label>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Latitude -->
<div class="madad-input">
<input class="min-h-[touch-target-min]" id="latitude" placeholder=" " required="" step="any" type="number"/>
<label for="latitude">Latitude</label>
</div>
<!-- Longitude -->
<div class="madad-input">
<input class="min-h-[touch-target-min]" id="longitude" placeholder=" " required="" step="any" type="number"/>
<label for="longitude">Longitude</label>
</div>
</div>
<!-- Map Preview (Optional Visual Enhancement) -->
<div class="mt-4 border border-outline-variant/12 rounded-lg h-[200px] overflow-hidden bg-surface-container-low flex items-center justify-center relative">
<span class="material-symbols-outlined text-outline text-[48px] absolute opacity-20">map</span>
<p class="text-on-surface-variant font-label-lg text-label-lg relative z-10">Map preview will appear once coordinates are entered</p>
</div>
</form>
</div>
</main>
<!-- Bottom Action Bar (Fixed for Transactional Flow) -->
<div class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-outline-variant/12 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] p-4 flex justify-end gap-4 z-40">
<button class="min-h-[touch-target-min] px-6 py-2 rounded-full border border-secondary text-secondary font-label-lg text-label-lg font-bold hover:bg-surface-container-low active:scale-95 transition-all flex items-center gap-2" type="button">
            Cancel
        </button>
<button class="min-h-[touch-target-min] px-8 py-2 rounded-full bg-[#118AB2] text-on-primary font-label-lg text-label-lg font-bold hover:opacity-90 active:scale-95 shadow-md transition-all flex items-center gap-2" form="addCenterForm" type="submit">
<span class="material-symbols-outlined text-[20px]">add_circle</span>
            Register Center
        </button>
</div>
<!-- Script to handle select placeholder logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const selects = document.querySelectorAll('select');
            selects.forEach(select => {
                select.addEventListener('change', function() {
                    if(this.value !== "") {
                        this.setAttribute('value', this.value);
                    }
                });
            });
        });
    </script>
</body></html>
